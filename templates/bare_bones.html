{% load static %}
<!DOCTYPE html>

<html lang="en-us" >
<head>
  <title>{{ title }}</title>
  <link rel="stylesheet" type="text/css" href="/static/admin/css/base.css" />
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" type="text/css" href="/static/admin/css/responsive.css" />
  <meta name="robots" content="NONE,NOARCHIVE" />
  {% include "util/libraries.html" %}
  {% include "global_style.html" %}
</head>

<body>

<!-- Container -->
<div id="container">
{% block header %}
  <!-- Header -->
  <div id="header">
    <h1 id="site-name">
      <a href="/admin/"><img src="{% static "img/logo.png" %}" width="150"></a>
    </h1>
  </div>
  <!-- END Header -->
{% endblock %}

  <!-- Content -->

<div style="margin: 42px;">
  {% block content %}
  {% endblock %}
</div>

</div>
</body>
</html>
