{% extends "dated_report.html" %}

{% block datedstyle %}
<style>
  #time_span_label { display: none; }
  #time_span { display: none; }
</style>
{% endblock %}

{% block dated_report_script %}
{% include "util/charts.html" %}
<script>
var time_series_chart = new TimeSeriesChart();

{% for point in points %}
time_series_chart.add_point({label: '{{ point.get_label }}', from_date: {{ point.get_from_date_str }}, interval: '{{ point.interval }}', total_income: {{ point.total_income.amount }}, total_expenses: {{ point.total_expenses.amount }}, cleaning_fees: {{ point.cleaning_fees.amount }}, channel_fees: {{ point.channel_fees.amount }}, taxes: {{ point.taxes.amount }}, rent: {{ point.rent.amount }}, max_occupancy: {{ point.max_occupancy }}, occupied_days: {{ point.occupied_days }}, net: {{ point.net.amount }}, adr: {{ point.adr.amount }}, occupancy_rate: {{ point.occupancy_rate }}, rev_par: {{ point.rev_par.amount }}});{% endfor %}

var colors = [
    '#ff9999',
    '#9999ff',
    '#99ff99',
    '#ffbb77',
    '#77bbff',
    '#bbff77',
    '#ff77bb',
    '#bb77ff',
    '#77ffbb',
    '#ff0000',
    '#0000ff',
    '#00ff00'];

function do_chart() {
  time_series_chart.clear_chart_datasets();
  for (var i = 0; i < use_series.length; i++) {
    time_series_chart.add_chart_dataset(use_series[i], colors[i]);
  }
  time_series_chart.put_chart_in($("#canvas_holder"));
}


function create_chart_series_checkboxes() {
  create_series_checkboxes(do_chart);
}

function get_options_query_string() {
  return 'series=' + use_series.join(',')
}

function get_page_title() {
  return "Rent and revenue time series";
}

window.onpopstate = function(e) {
  set_use_series_by_query_string();
  create_chart_series_checkboxes();
  do_chart();
};

$(function() {
  set_use_series_by_query_string();
  create_chart_series_checkboxes();
  do_chart();
});

</script>
{% endblock %}

{% block content %}

{% include "date_search_panel.html" %}

<div id="series_checkboxes" class="checkboxes_box"></div>

<div id="canvas_holder"></div>

{% include "field_definitions.html" %}

{% endblock %}
