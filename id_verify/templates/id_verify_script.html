<script>
  function vertically_center_content() {
    $('.content-wrapper').each(function() {
      var wrapper = $(this);
      var content = wrapper.find('.content');
      var padding = (wrapper.innerHeight() - content.innerHeight()) / 2;
      if (padding < 0) {
        padding = 0;
      }
      content.css('padding-top', padding);
    });
  }
  function set_min_heights() {
    $('.content-wrapper').each(function() {
      var wrapper = $(this);
      var content = wrapper.find('.content');
      wrapper.css('min-height', content.innerHeight());
    });
  }
  $(vertically_center_content);
  $(set_min_heights);
  $(window).resize(vertically_center_content);
</script>
<script>
  function setup_no_letter_inputs() {
    $('.no-letters').each(function() {
      $(this).keypress(function(event) {
        var key = event.which;
        var A = 65, Z = 90, a = 97, z = 122;
        if (key) {
          if ((A <= key && key <= Z) || (a <= key && key <= z)) {
            event.preventDefault();
          }
        }
      });
    });
  }
  $(setup_no_letter_inputs);

  function setup_navigation() {
    $('.button').each(function() {
      var button = $(this);
      var go_to = button.attr('data-goto-panel');
      if (go_to) {
        button.click(function() {
          var go_to_panel = $("#" + go_to);
          go_to_panel.find('input[type=text]').select();
          $('html, body').animate({
              scrollTop: go_to_panel.offset().top
          }, 500, 'swing', function() {
            // Putting the cursor in the input causes the keyboard to pop up.
            // Removing the cursor from a text input causes the keyboard to
            // disappear. These change the window height and therefore affect
            // scrolling. So just double check and scroll again if necessary.
            if ($(document).scrollTop() != go_to_panel.offset().top) {
              $('html, body').animate({
                  scrollTop: go_to_panel.offset().top
              }, 500);
            }
          });
        });
      }
    });
  }
  $(setup_navigation);

  function setup_show_on_change() {
    $('.show-something').each(function() {
      $(this).keyup(function() {
        var me = $(this);
        var show = $('#' + me.attr('data-show'));
        if (me.prop('value')) {
          show.fadeIn();
        } else {
          show.fadeOut();
        }
      });
    });
  }
  $(setup_show_on_change);

  function copy_stuff_around() {
    var email = $('#email').val();
    $('#provided_email').text(email);
    $('#submit_email').val(email);

    var provided_phone = $('#phone').val();
    $('#submit_phone').val(provided_phone);
    var phone = provided_phone || $('#existing-phone').text();
    $('#use_phone').text(phone);
  }
  $(copy_stuff_around);
  $(function() {
    $('#email,#phone').keyup(copy_stuff_around);
  });

  function synchronize_check_boxes() {
    $('#yes-texts-1,#yes-texts-2').change(function() {
      var checked = $(this).prop('checked');
      $('#yes-texts-1,#yes-texts-2').prop('checked', checked);
      $('#opt_in_texts').val(checked);
    });
    $('#yes-emails').change(function() {
      $('#opt_in_email').val($(this).prop('checked'));
    });
  }
  $(synchronize_check_boxes);

  function yes_chargebacks() {
    return $('#panel-cc').length;
  }

  function validate() {
    var email = $('#email').val();
    var is_valid_email_format = !email || email.indexOf('@') >= 0;
    var problem_count =
        display_error_helper($('#panel-email .required-wrapper'), email)
        + display_error_helper(
            $('#panel-email .format-wrapper'), is_valid_email_format)
        + display_error_helper(
            $('#panel-id .required-wrapper'), $('#id_file_upload').val());
    // The phone is required only if there isn't a default.
    var required_phone = $('#panel-phone .required-wrapper');
    if (required_phone.length) {
      problem_count += display_error_helper(required_phone, $('#phone').val());
    }
    if (yes_chargebacks()) {
      problem_count += display_error_helper(
          $('#panel-cc .required-wrapper'), $('#cc_file_upload').val());
    }
    $('#error-count').text(problem_count);
    display_error_helper($('#panel-verify .error-wrapper'), !problem_count);
    return !problem_count;
  }

  function display_error_helper(error_panel, is_valid) {
    if (is_valid) {
      error_panel.css('display', 'none');
      return 0;
    }
    error_panel.css('display', 'inline-block');
    return 1;
  }

  function setup_done_click() {
    $('#done-button').click(function() {
      if (validate()) {
        $('#submit-form').submit();
      }
    });
  }
  $(setup_done_click);
</script>

<script id="file_upload_functions">
  function setup_file_upload_hover() {
    $('.file-upload-box').hover(function() {
      $(this).addClass('hover');
    }, function() {
      $(this).removeClass('hover');
    });
  }
  $(setup_file_upload_hover);

  function set_up_file_upload() {
    $(".file_input").change(function() {
      sign_and_upload($(this));
    });
  }

  $(set_up_file_upload);

  function file_from_input($file_input) {
    return $file_input[0].files[0];
  }

  function sign_and_upload($file_input) {
    var xhr = new XMLHttpRequest();
    var file = file_from_input($file_input);
    xhr.open(
        "GET",
        "/verify_id/sign_s3?file_type=" + file.type + '&destination_prefix='
            + $file_input.attr('data-destination-prefix'));
    var status_div = $file_input.parent().find('.box-text');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var response = JSON.parse(xhr.responseText);
          var on_successful_upload = function() {
            var put_result = $("#" + $file_input.attr('data-put-result'));
            var show_button = $("#" + $file_input.attr('data-show-button'));
            status_div.text('Success! Thank you :)');
            put_result.val(response.destination_file_name);
            show_button.fadeIn();
            // Hide the required error message if it's visible.
            $file_input.parents(
                '.content-wrapper').find('.error-wrapper').hide();
          };
          var on_failure = function(evt) {
            status_div.text(
                'There was an error uploading your photo :( '
                + evt.statusText);
          };
          status_div.text('Uploading...');
          upload_and_callback(
              file, response.presigned_post, response.destination_file_name,
              on_successful_upload, on_failure);
        } else {
          status_div.text(
              "Whoops, our software seems to be broken. "
              + "The development team has been informed.");
        }
      }
    };
    xhr.send();
  }

  function upload_and_callback(
      file, s3Data, destination_file_name, on_successful_upload, on_failure) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", s3Data.url);

    var postData = new FormData();
    for (key in s3Data.fields) {
      postData.append(key, s3Data.fields[key]);
    }
    postData.append('file', file);

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 204) {
          on_successful_upload();
        } else {
          on_failure(xhr);
        }
     }
    };
    xhr.send(postData);
  }
</script>
