language: python

python: 3.6

services: postgresql

env:
  global:
  - DJANGO_SETTINGS_MODULE=stayd.travis_settings
  - PYTHONPATH=$HOME/build/dasmith2/stayd

install:
  - pipenv install

before_script:
# This must match stayd/settings.py
  - psql -c 'create database travis_ci_test;' -U postgres

script:
  python manage.py migrate

notifications:
  email:
    on_success: change
    on_failure: always
