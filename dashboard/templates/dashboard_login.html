<!DOCTYPE html>
<html>
<head>
  <title>Howard</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
* {
  box-sizing: border-box;
}

body, h1, h2, h3, h4, h5, h6 {
  margin: 0;
  padding: 0;
  font-family: 'OpenSans', sans-serif;
}

.content-wrap {
  background-color: #324755;
  width: 100vw;
  height: 100vh;
  position: relative;
}

.content {
  position: absolute;
  transform: translate(-50%, -50%);
  top: 50%;
  left: 50%;
  max-width: 70%;
  width: 100%;
}

.logo {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  width: 100%;
  height: 100%;
  max-width: 490px;
  display: block;
  margin: 0 auto;
  margin-bottom: 75px;
}

.logo::after {
  padding-top: 21%;
  content: '';
  display: block;
}

.text {
  color: #E2B99F;
  font-size: 28px;
  text-align: center;
}

@media only screen and (max-width: 550px) {
  .text {
    font-size: 20px;
  }
}

form {
  margin: 50px auto 0px auto;
  width: 339px;
  color: #fff;
}

form label {
  width: 88px;
  display: inline-block;
}

form button {
  margin-left: 270px;
}
  </style>
</head>
<body>
  <div class="content-wrap">
    <div class="content">
      <div class="logo" style="background-image: url(/static/img/logo.png);"></div>
      <h4 class="text">Owner's Dashboard</h4>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
