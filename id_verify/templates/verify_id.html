{% comment %}
  For file uploads, I'm basically following the directions on
  https://devcenter.heroku.com/articles/s3-upload-python
  with the big exception that I remove public acls.
{% endcomment %}
<html>
  <head>
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
  </head>
  <body>
    <input type="file" id="file_input"/>
    <p id="status">Please select a file</p>

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" id="destination_file_name"
          name="destination_file_name">
      <input type="text" id="email" name="email">
      <input type="submit" value="Submit" id="submit" style="display: none;">
    </form>
  </body>
</html>
