{% extends "bare_bones.html" %}

{% block content %}
<style>
  .page_wrapper { margin: 42px; }
  .fifty { width: 49%; display: inline-block; vertical-align: top; }
  .questions { margin: 0px auto; }
  .button_wrapper { text-align: right; width: 98% }
  form .button { padding: 10px; font-size: 20px; margin-top: 10px; }
  .page_wrapper h1 { margin: 0px; }
  ul.navigation {
      list-style-type: none; margin: 0 0 20px; padding: 0;
      background-color: #79aec8; }
  ul.navigation a {
      color: #fff; font-size: 18px; display: inline-block;  padding: 20px;}
  ul.navigation li { display: inline-block; }
  ul.navigation li.selected, ul.navigation li:hover {
      font-weight: bold; background-color: #699eb8; }
</style>

<div class="page_wrapper">
  <ul class="navigation">
    <li class="{% if valid_selected %}selected{% endif %}">
      <a href="{{ valid_url }}">Submissions: {{ valid_count }}</a>
    </li>
    <li class="{% if unpaid_selected %}selected{% endif %}">
      <a href="{{ unpaid_url }}">
        Payment problems: {{ unpaid_count }}
      </a>
    </li>
    <li class="{% if no_cc_info_selected %}selected{% endif %}">
      <a href="{{ no_cc_info_url }}">
        Missing cc info: {{ no_cc_info_count }}
      </a>
    </li>
  </ul>

  {% block list %}
  {% endblock %}

</div>
{% endblock %}
