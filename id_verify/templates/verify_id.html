{% comment %}
  For file uploads, I'm basically following the directions on
  https://devcenter.heroku.com/articles/s3-upload-python
  with the big exception that I remove public acls.
{% endcomment %}
<html>
  <head>
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script>

function set_up_file_upload() {
  $("#file_input").change(function() {
    var file = $("#file_input")[0].files[0];
    if (!file) {
      return alert("No file selected.");
    }
    sign_and_upload(file);
  });
}

$(set_up_file_upload);

function sign_and_upload(file) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/verify_id/sign_s3?file_type=" + file.type);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var response = JSON.parse(xhr.responseText);
        upload_file(
            file, response.presigned_post, response.destination_file_name);
      } else {
        alert("Could not get signed URL.");
      }
    }
  };
  xhr.send();
}

function upload_file(file, s3Data, destination_file_name) {
  var xhr = new XMLHttpRequest();
  xhr.open("POST", s3Data.url);

  var postData = new FormData();
  for (key in s3Data.fields) {
    postData.append(key, s3Data.fields[key]);
  }
  postData.append('file', file);

  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200 || xhr.status === 204) {
        $("#destination_file_name").val(destination_file_name);
        $("#submit").show();
      } else {
        alert("Could not upload file.");
      }
   }
  };
  xhr.send(postData);
}

    </script>
  </head>
  <body>
    <input type="file" id="file_input"/>
    <p id="status">Please select a file</p>

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" id="destination_file_name"
          name="destination_file_name">
      <input type="text" id="email" name="email">
      <input type="submit" value="Submit" id="submit" style="display: none;">
    </form>
  </body>
</html>
