<div id="options">
  <label for="time_span" id="time_span_label">One row per</label>
  <select id="time_span">
    <option>day</option>
    <option>week</option>
    <option>month</option>
  </select>
  {% if owners %}
    <label for="owner" id="owner_label">Owner</label>
    <select id="owner">
      <option>---</option>
      {% for owner in owners %}
        <option value="{{ owner.pk }}"
         {% if owner.pk == owner_id %}selected="selected"{% endif %}>
            {{ owner.email }}
        </option>
      {% endfor %}
    </select>
  {% endif %}
  {% include "util/date_inputs.html" %}
</div>
<p class="explanation">
  To query all of February, say, use 02/01/2018 to 03/01/2018.
</p>
