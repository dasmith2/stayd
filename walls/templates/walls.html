{% include "util/libraries.html" %}
<style>
body {
    background-color: #454b51; color: #fff;
    font-family: 'ArgentCF-Regular', serif;  font-size: 40px;}
.photo {
    background-color: #fff; color: #454b51; padding: 30px; margin: 15px 30px 15px 0px;
    display: inline-block; font-size: 10px; }
.keep
h1 { margin-bottom: 0px; }
.description { margin-bottom: 50px; font-size: 30px; }
.keep { margin: 0px; padding: 0px; }

label { display: block; padding-left: 15px; text-indent: -15px; }
.keep {
  width: 13px; height: 13px; padding: 0; margin:0; vertical-align: bottom;
  position: relative; top: -1px; *overflow: hidden;
}
</style>
{% verbatim %}
<script id="photo" type="text/x-handlebars-template">
  <div class="photo">
    <div class="photo_file">
      <img src="https://images.unsplash.com/{{photo_id}}?w=350">
    </div>
    <div class="src">https://images.unsplash.com/{{photo_id}}</div>
    <label><input type="checkbox" class="keep"> Keep</label>
  </div>
</script>
{% endverbatim %}
<script>
function random_photo_id() {
  return photo_ids[
      Math.floor(Math.random() * photo_ids.length)];
}

function photo_template() {
  return Handlebars.compile($('#photo').html());
}

var photos = [];
class Photo {
  constructor(photo_id) {
    this.photo_id = photo_id;
  }

  add_to_page() {
    var data = {'photo_id': this.photo_id};
    this.elt = $(photo_template()(data)).appendTo($('#photos'));
    this.keep_checkbox = this.elt.find('.keep');
  }

  remove_from_page() {
    this.elt.remove();
    for (var i = 0; i < photos.length; i++) {
      if (photos[i].photo_id == this.photo_id) {
        photos.splice(i, 1);
        return;
      }
    }
  }

  keep() {
    return this.keep_checkbox.prop('checked');
  }
}

function photo_id_on_page(photo_id) {
  for (var i = 0; i < photos.length; i++) {
    if (photos[i].photo_id == this.photo_id) {
      return true;
    }
  }
  return false;
}

function load_one_photo() {
  var new_photo_id = random_photo_id();
  while (photo_id_on_page(new_photo_id)) {
    new_photo_id = random_photo_id();
  }
  var photo = new Photo(new_photo_id);
  photos.push(photo);
  photo.add_to_page();
}

function load_until_3_photos() {
  while (photos.length < 3) {
    load_one_photo()
  }
}

function remove_unchecked_photos() {
  var to_remove = [];
  for (var i = 0; i < photos.length; i++) {
    if (!photos[i].keep()) {
      to_remove.push(photos[i]);
    }
  }
  for (var i = 0; i < to_remove.length; i++) {
    to_remove[i].remove_from_page();
  }
}

function set_background_color() {
  $('body').css({backgroundColor: $('#background_color').val()});
}

function wire_up_background_color() {
  $('#set_background_color').click(set_background_color);
}

function wire_up_try_new_photos() {
  $('#try_new_photos').click(function() {
    remove_unchecked_photos();
    load_until_3_photos();
  });
}

function init() {
  wire_up_try_new_photos();
  wire_up_background_color();
  set_background_color()
  load_until_3_photos();
}

$(init);
</script>
