<style id="file-upload-styles">
  .file-upload-box div { padding: 0; margin: 0; }
  .file-upload-box { position: relative; width: 249px; height: 250px; }
  .file-upload-box .box {
      position: relative; height: 100%; padding: 1px 0; }
  .file-upload-box input {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 5;
      opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .box-content-wrapper {
      padding: 0 1px; width: 247px; height: 250px; display: table; }
  .box-content {
      display: table-cell; text-align: center; vertical-align: middle; }
  .file-upload-box svg {
      padding-top: 15px; margin: 0 auto; max-width: 247px;
      max-height: 200px; }
  .file-upload-box .box-text {
      padding: 15px; color: #FFF8A8; text-align: center; line-height: 20px;
      font-size: 14px; }
  .file-upload-box .aux {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      border-color: #FFF8A8; }
  .file-upload-box .aux div {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      border-radius: 3px; }
  .file-upload-box .bg { z-index: 2; background: #fff8a8; opacity: .05; }
  .file-upload-box.hover .bg { opacity: .15; }
  .file-upload-box .bd {
      z-index: 4; border: 1px solid rgba(255,248,168,0.6); }
</style>
<style>
  .button-wrapper { margin-left: -4px; }
  .button-wrapper.wide div { width: 100%; }
  .button-wrapper-wrapper { height: 54px; }
  .button {
      display: inline-block; margin: 4px; cursor: pointer;
      background-color: #E4E6E5; width: auto;
      line-height: 38px; padding: 5px 20px 3px 18px; font-size: 25px;
      border-radius: 4px; text-align: center; font-weight: bold;
      color: #626966; box-shadow: 0 3px 12px 0 rgba(0,0,0,0.1)}
  .button:hover { background-color: #f4f6f5; }
  .input-wrapper { margin-bottom: 29px; }
  input[type=text] {
      background: none; outline: none;
      border-color: rgba(255,248,168,0.4);
      transition: border 0ms linear 600ms,border-radius 0ms linear 600ms;
      border: 1px solid transparent; border-bottom: 1px solid #fff;
      color: #fff; font-size: 24px; line-height: 30px; margin: 1px; }
  input[type=checkbox] { margin: 10px 0px 0px 0px; }
  #promotions-wrapper { margin-top: 10px; }
  #promotions-wrapper input { margin-left: 0px; }
  .error-wrapper {
      background-color: #990000; display: inline-block; font-size: 13px;
      padding: 5px 8px; margin-top: 20px; border-radius: 2px;
      position: relative; }
  .error-triangle {
      width: 0; height: 0;
      position: absolute;
      top: -5px; left: 10px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 5px solid #990000; }

  .start-hidden, .error-wrapper { display: none; }

  /* Mobile styles */
  @media only screen and (max-width: 800px) {
  }

</style>

<script>
  function setup_navigation() {
    $('.button').each(function() {
      var button = $(this);
      var go_to = button.attr('data-goto-panel');
      if (go_to) {
        button.click(function() {
          var go_to_panel = $("#" + go_to);
          $('html, body').animate({
              scrollTop: go_to_panel.offset().top
          }, 500);
          go_to_panel.find('input[type=text]').select();
        });
      }
    });
  }
  $(setup_navigation);

  function setup_show_on_change() {
    $('.show-something').each(function() {
      $(this).keyup(function() {
        var me = $(this);
        var show = $('#' + me.attr('data-show'));
        if (me.prop('value')) {
          show.fadeIn();
        } else {
          show.fadeOut();
        }
      });
    });
  }
  $(setup_show_on_change);

  function copy_stuff_around() {
    var email = $('#email').val();
    $('#provided_email').text(email);
    $('#submit_email').val(email);

    var provided_phone = $('#phone').val();
    $('#submit_phone').val(provided_phone);
    var phone = provided_phone || $('#existing-phone').text();
    $('#use_phone').text(phone);
  }
  $(copy_stuff_around);
  $(function() {
    $('#email,#phone').keyup(copy_stuff_around);
  });

  function synchronize_check_boxes() {
    $('#yes-texts-1,#yes-texts-2').change(function() {
      var checked = $(this).prop('checked');
      $('#yes-texts-1,#yes-texts-2').prop('checked', checked);
      $('#opt_in_texts').val(checked);
    });
    $('#yes-emails').change(function() {
      $('#opt_in_email').val($(this).prop('checked'));
    });
  }
  $(synchronize_check_boxes);

  function yes_chargebacks() {
    return $('#panel-cc').length;
  }

  function validate() {
    var problem_count =
        validate_helper(
            $('#panel-email .error-wrapper'), $('#email').val())
        + validate_helper(
            $('#panel-id .error-wrapper'), $('#id_file_upload').val());
    // The phone is required only if there isn't a default.
    var required_phone = $('#panel-phone .error-wrapper');
    if (required_phone.length) {
      problem_count += validate_helper(
          required_phone, $('#phone').val());
    }
    if (yes_chargebacks()) {
      problem_count += validate_helper(
          $('#panel-cc .error-wrapper'), $('#cc_file_upload').val());
    }
    $('#error-count').text(problem_count);
    validate_helper($('#panel-verify .error-wrapper'), !problem_count);
    return !problem_count;
  }

  function validate_helper(error_panel, required_value) {
    if (required_value) {
      error_panel.css('display', 'none');
      return 0;
    }
    error_panel.css('display', 'inline-block');
    return 1;
  }

  function setup_done_click() {
    $('#done-button').click(function() {
      if (validate()) {
        $('#submit-form').submit();
      }
    });
  }
  $(setup_done_click);
</script>

<script id="file_upload_functions">
  function setup_file_upload_hover() {
    $('.file-upload-box').hover(function() {
      $(this).addClass('hover');
    }, function() {
      $(this).removeClass('hover');
    });
  }
  $(setup_file_upload_hover);

  function set_up_file_upload() {
    $(".file_input").change(function() {
      sign_and_upload($(this));
    });
  }

  $(set_up_file_upload);

  function file_from_input($file_input) {
    return $file_input[0].files[0];
  }

  function sign_and_upload($file_input) {
    var xhr = new XMLHttpRequest();
    var file = file_from_input($file_input);
    xhr.open(
        "GET",
        "/verify_id/sign_s3?file_type=" + file.type + '&destination_prefix='
            + $file_input.attr('data-destination-prefix'));
    var status_div = $file_input.parent().find('.box-text');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var response = JSON.parse(xhr.responseText);
          var on_successful_upload = function() {
            var put_result = $("#" + $file_input.attr('data-put-result'));
            var show_button = $("#" + $file_input.attr('data-show-button'));
            status_div.text('Success! Thank you :)');
            put_result.val(response.destination_file_name);
            show_button.fadeIn();
            // Hide the required error message if it's visible.
            $file_input.parents(
                '.content-wrapper').find('.error-wrapper').hide();
          };
          var on_failure = function(evt) {
            status_div.text(
                'There was an error uploading your photo :( '
                + evt.statusText);
          };
          status_div.text('Uploading...');
          upload_and_callback(
              file, response.presigned_post, response.destination_file_name,
              on_successful_upload, on_failure);
        } else {
          status_div.text(
              "Whoops, our software seems to be broken. "
              + "The development team has been informed.");
        }
      }
    };
    xhr.send();
  }

  function upload_and_callback(
      file, s3Data, destination_file_name, on_successful_upload, on_failure) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", s3Data.url);

    var postData = new FormData();
    for (key in s3Data.fields) {
      postData.append(key, s3Data.fields[key]);
    }
    postData.append('file', file);

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 204) {
          on_successful_upload();
        } else {
          on_failure(xhr);
        }
     }
    };
    xhr.send(postData);
  }
</script>
