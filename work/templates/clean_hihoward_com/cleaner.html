{% extends "admin/stayd_base.html" %}

{% block breadcrumbs %}
{% endblock %}

{% block content %}
  {% include "clean_hihoward_com/nav.html" %}
  {% if problem %}
    <h2>{{ problem }}</h2>
  {% else %}
    <style>
      .helptext { color: #999; font-size: 11px; }
    </style>

    <form method="POST">
      {% csrf_token %}
      <table>
        {{ form.as_table }}
      </table>
      <input type="submit" class="button" value="Save">
      <a class="button" href="{{ cleaners_url }}">Cancel</a>
    </form>
  {% endif %}
{% endblock %}
