{% extends "dated_report.html" %}

{% block dated_report_script %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.js"></script>
<script>

function field(name, key) {
  return {name: name, key: key};
}

var fields = [
  field('Net revenue', 'net'),
  field('Total charges', 'total_charges'),
  field('Cleaning fees', 'cleaning_fees'),
  field('Channel fees', 'channel_fees'),
  field('Taxes', 'taxes'),
  field('Rent', 'rent'),
  field('Max occupancy', 'max_occupancy'),
  field('Occupied rooms', 'occupied_days'),
  field('ADR', 'adr'),
  field('% occupancy', 'occupancy_rate'),
  field('RevPAR', 'rev_par')
];

var all_datasets = {};

fields.forEach(function(field) {
  all_datasets[field.key] = {label: field.name, data: []};
});

var labels = [];

function add_point(label, point) {
  labels.push(label);
  for (var key in point) {
    all_datasets[key].data.push(Math.round(point[key]));
  }
}

{% for point in points %}
add_point('{{ point.get_label }}', {total_charges: {{ point.total_charges.amount }}, cleaning_fees: {{ point.cleaning_fees.amount }}, channel_fees: {{ point.channel_fees.amount }}, taxes: {{ point.taxes.amount }}, rent: {{ point.rent.amount }}, max_occupancy: {{ point.max_occupancy }}, occupied_days: {{ point.occupied_days }}, net: {{ point.net.amount }}, adr: {{ point.adr.amount }}, occupancy_rate: {{ point.occupancy_rate }}, rev_par: {{ point.rev_par.amount }}});{% endfor %}

var use_datasets = [];

function set_use_datasets_by_query_string() {
  var query_str_obj = get_query_string_obj();
  var series = query_str_obj['series'];
  if (series) {
    use_datasets = series.split(',');
  }
}
set_use_datasets_by_query_string();

function get_query_string_obj() {
  var search = location.search.substring(1);
  return JSON.parse(
      '{"' + decodeURI(search).replace(/"/g, '\\"').replace(
          /&/g, '","').replace(/=/g,'":"') + '"}')
}

function create_dataset_checkboxes() {
  var outer_box = $("#dataset_checkboxes").empty()
  fields.forEach(function(field) {
    var label = $("<label></label>");
    var box = $("<input type='checkbox'>");
    label.append(box);
    label.append(field.name);
    outer_box.append(label);

    box.prop('checked', use_datasets.indexOf(field.key) !== -1);
    box.change(function() {
      var index = use_datasets.indexOf(field.key);
      var checked = $(this).is(':checked');
      if (index !== -1 && !checked) {
        use_datasets.splice(index, 1);
      } else if (index == -1 && checked) {
        use_datasets.push(field.key);
      }
      do_chart();
      var new_url =
          window.location.pathname + '?series=' + use_datasets.join(',');
      window.history.pushState("whatever", "Time series", new_url);
    });
  });
}

window.onpopstate = function(e) {
  set_use_datasets_by_query_string();
  create_dataset_checkboxes();
  do_chart();
};

var colors = [
    '#ff9999',
    '#99ff99',
    '#9999ff',
    '#ffbb77',
    '#bbff77',
    '#77bbff',
    '#ff77bb',
    '#77ffbb',
    '#bb77ff',
    '#ff0000',
    '#00ff00',
    '#0000ff'];

function do_chart() {
  var chart_datasets = [];
  for (var i = 0; i < use_datasets.length; i++) {
    var field_key = use_datasets[i];
    var dataset = all_datasets[field_key];
    dataset.backgroundColor = 'rgba(0, 0, 0, 0.0)'; // Full transparency
    dataset.borderColor = colors[i];
    chart_datasets.push(dataset);
  }

  var ctx = document.getElementById("myChart").getContext('2d');
  var myLineChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: chart_datasets
      },
      options: {}
  });
}

$(create_dataset_checkboxes);
$(do_chart);

</script>
{% endblock %}

{% block datedstyle %}
<style>
  #dataset_checkboxes label { margin: 10px; }
  #dataset_checkboxes { margin-bottom: 22px; }
</style>
{% endblock %}

{% block content %}

{% include "date_search_panel.html" %}

<div id="dataset_checkboxes"></div>

<canvas id="myChart" width="200" height="50"></canvas>

{% include "field_definitions.html" %}

{% endblock %}
