{% extends "dated_report.html" %}

{% block datedstyle %}
<style>
  #time_span_label { display: none; }
  #time_span { display: none; }
</style>
{% endblock %}

{% block dated_report_script %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.js"></script>
<script>

var all_datasets = {};

fields.forEach(function(field) {
  all_datasets[field.key] = {label: field.name, data: []};
});

var labels = [];

function add_point(label, point) {
  labels.push(label);
  for (var key in point) {
    all_datasets[key].data.push(Math.round(point[key]));
  }
}

{% for point in points %}
add_point('{{ point.get_label }}', {total_charges: {{ point.total_charges.amount }}, total_expenses: {{ point.total_expenses.amount }}, cleaning_fees: {{ point.cleaning_fees.amount }}, channel_fees: {{ point.channel_fees.amount }}, taxes: {{ point.taxes.amount }}, rent: {{ point.rent.amount }}, max_occupancy: {{ point.max_occupancy }}, occupied_days: {{ point.occupied_days }}, net: {{ point.net.amount }}, adr: {{ point.adr.amount }}, occupancy_rate: {{ point.occupancy_rate }}, rev_par: {{ point.rev_par.amount }}});{% endfor %}

var colors = [
    '#ff9999',
    '#9999ff',
    '#99ff99',
    '#ffbb77',
    '#77bbff',
    '#bbff77',
    '#ff77bb',
    '#bb77ff',
    '#77ffbb',
    '#ff0000',
    '#0000ff',
    '#00ff00'];

function do_chart() {
  var chart_datasets = [];
  for (var i = 0; i < use_series.length; i++) {
    var field_key = use_series[i];
    var dataset = all_datasets[field_key];
    dataset.backgroundColor = 'rgba(0, 0, 0, 0.0)'; // Full transparency
    dataset.borderColor = colors[i];
    chart_datasets.push(dataset);
  }

  var canvas_holder = $("#canvas_holder").empty();
  var canvas = $("<canvas width='200' height='50'></canvas>");
  canvas_holder.append(canvas)
  var ctx = canvas[0].getContext('2d');
  new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: chart_datasets
      },
      options: {}
  });
}

function create_chart_series_checkboxes() {
  create_series_checkboxes(do_chart);
}

function get_options_query_string() {
  return 'series=' + use_series.join(',')
}

function get_page_title() {
  return "Rent and revenue time series";
}

window.onpopstate = function(e) {
  set_use_series_by_query_string();
  create_chart_series_checkboxes();
  do_chart();
};

$(function() {
  set_use_series_by_query_string();
  create_chart_series_checkboxes();
  do_chart();
});

</script>
{% endblock %}

{% block content %}

{% include "date_search_panel.html" %}

<div id="series_checkboxes" class="checkboxes_box"></div>

<div id="canvas_holder"></div>

{% include "field_definitions.html" %}

{% endblock %}
