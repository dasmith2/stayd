<!DOCTYPE html>

<html lang="en-us" >
<head>
  <title>Stayd cleaning schedule</title>
  <link rel="stylesheet" type="text/css" href="/static/admin/css/base.css" />
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="stylesheet" type="text/css" href="/static/admin/css/responsive.css" />
  <meta name="robots" content="NONE,NOARCHIVE" />
</head>

<body class="">

<!-- Container -->
<div id="container">
  <!-- Header -->
  <div id="header">
    <div id="branding">
      <h1 id="site-name">Cleaning schedule</h1>
    </div>
  </div>
  <!-- END Header -->

  <!-- Content -->

<form method="POST" style="margin: 20px 0px 0px 31px; display: inline-block;">
  {% csrf_token %}
  <table>
    <thead>
      <tr><th>Checkout</th><th>Notes</th></tr>
    </thead>
    <tbody>
      {% for reservation in reservations %}
        <tr class="{% cycle 'row1' 'row2' %}">
          <td>
            {{ reservation.check_out }}
            <br/>
            {{ reservation.listing.rental.airbnb_address_scrape }}
          </td>
          <td>
            <input type="hidden" name="reservation_{{ reservation.pk }}">
            <textarea name="notes_{{ reservation.pk }}"
            >{{ reservation.cleaning_notes }}</textarea>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <div style="margin: 7px; text-align: right;">
    <input type="submit" value="save">
  </div>
</form>

</div>
</html>
